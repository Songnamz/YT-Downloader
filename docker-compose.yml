services:
  ytdownloader:
    build: .
    image: yt-downloader-web:latest
    container_name: ytdownloader
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8000"
    environment:
      MAX_CONCURRENT: "2"       # downloads running at the same time
      JOB_TTL_MINUTES: "5"      # finished files are deleted after this
      MIN_FREE_GB: "5"          # keep this much disk free (old files deleted early)
      MAX_HEIGHT: "2160"        # cap resolution (e.g. 1080 to save disk/bandwidth)
      CONCURRENT_FRAGMENTS: "8" # parallel connections per download (1 = off)
      PLAYLIST_PARALLEL: "3"    # playlist videos downloaded at the same time
      AUTO_UPDATE: "1"          # update yt-dlp each time the container starts
      ALLOW_ANY_SITE: "1"       # 0 = YouTube links only (hides the "Other sites" menu)
      # Login: set APP_PASSWORD and SECRET_KEY in .env (kept out of git)
      APP_PASSWORD: "${APP_PASSWORD:-}"
      SECRET_KEY: "${SECRET_KEY:-}"
      LOGIN_DAYS: "30"          # stay logged in this many days
    volumes:
      # Optional: put a YouTube cookies.txt here if you hit "Sign in to confirm you're not a bot"
      - ./data:/data:ro
